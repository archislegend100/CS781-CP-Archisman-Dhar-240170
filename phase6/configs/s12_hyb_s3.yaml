# S12: abstract-then-extract fill on S3 (LongLegal QLoRA): generated summary kept as the backbone, topped up to a held-out-tuned word budget
# with the most salient document sentences (overlap with the generated summary + opening/closing position prior), in
# document order, trigram-blocked. No new training or generation (rebuilt from the saved outputs).
base: base.yaml
id: S12
name: sm_hybrid_s3
sm:
  chunk: 2560
hyb:
  fromrun: sm_long_qlora
  source: raw
  lengrid: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0]
  posgrid: [0.0, 0.2]
  minwords: 80
  maxwords: 2000
