# S10: abstract-then-extract fill on S1 (LoRMA+): generated summary kept as the backbone, topped up to a held-out-tuned word budget
# with the most salient document sentences (overlap with the generated summary + opening/closing position prior), in
# document order, trigram-blocked. No new training or generation (rebuilt from the saved outputs).
base: base.yaml
id: S10
name: sm_hybrid_s1
hyb:
  fromrun: sm_gpt_lorma
  source: raw
  lengrid: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0]
  posgrid: [0.0, 0.2]
  minwords: 80
  maxwords: 2000
